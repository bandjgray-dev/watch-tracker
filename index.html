<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Collection Tracker</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-dark); padding-bottom: 40px; }
        
        header { background: #0f172a; color: white; padding: 16px; position: sticky; top: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 1.2rem; font-weight: 700; }
        
        .btn { background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 20px; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
        .btn:active { background: var(--primary-hover); }
        .btn-outline { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
        .btn-danger { background: var(--danger); }
        
        main { max-width: 600px; margin: 0 auto; padding: 16px; }
        
        .filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 12px; }
        .filter-btn { background: white; border: 1px solid var(--border); padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; white-space: nowrap; }
        .filter-btn.active { background: #0f172a; color: white; border-color: #0f172a; }
        
        .grid { display: flex; flex-direction: column; gap: 16px; }
        .card { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; }
        .card-img { height: 180px; width: 100%; object-fit: cover; background: #e2e8f0; }
        .card-body { padding: 14px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .badge { background: #e0e7ff; color: #3730a3; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }
        .card-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 4px; }
        .card-desc { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px; }
        .card-footer { background: #f8fafc; padding: 10px 14px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        
        /* Modal Styles */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; align-items: center; justify-content: center; padding: 16px; }
        .modal.open { display: flex; }
        .modal-content { background: white; border-radius: 16px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; padding: 20px; }
        .modal-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 16px; }
        
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
        .form-control { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.9rem; background: #f8fafc; }
        .row { display: flex; gap: 10px; }
        .row > div { flex: 1; }
        
        .custom-row { display: flex; gap: 6px; margin-bottom: 6px; }
    </style>
</head>
<body>

    <header>
        <h1>⌚ Watch Vault</h1>
        <button class="btn" id="addWatchBtn">+ Add Watch</button>
    </header>

    <main>
        <div class="filters" id="categoryFilters">
            <button class="filter-btn active" onclick="setFilter('All', this)">All</button>
            <button class="filter-btn" onclick="setFilter('Diver', this)">Diver</button>
            <button class="filter-btn" onclick="setFilter('Dress', this)">Dress</button>
            <button class="filter-btn" onclick="setFilter('Chronograph', this)">Chronograph</button>
            <button class="filter-btn" onclick="setFilter('Field', this)">Field</button>
            <button class="filter-btn" onclick="setFilter('Vintage', this)">Vintage</button>
        </div>

        <div id="watchGrid" class="grid"></div>
    </main>

    <!-- Modal Form -->
    <div id="watchModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle" class="modal-title">Add New Watch</h2>
            <form id="watchForm">
                <input type="hidden" id="watchId">
                <div class="row">
                    <div class="form-group"><label>Brand</label><input type="text" id="brand" required class="form-control"></div>
                    <div class="form-group"><label>Model</label><input type="text" id="model" required class="form-control"></div>
                </div>
                <div class="row">
                    <div class="form-group">
                        <label>Category</label>
                        <select id="category" class="form-control">
                            <option value="Diver">Diver</option>
                            <option value="Dress">Dress</option>
                            <option value="Chronograph">Chronograph</option>
                            <option value="Field">Field</option>
                            <option value="Vintage">Vintage</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Movement</label><input type="text" id="movementType" placeholder="Automatic..." class="form-control"></div>
                </div>
                <div class="row">
                    <div class="form-group"><label>Serial No.</label><input type="text" id="serialNumber" class="form-control"></div>
                    <div class="form-group"><label>Est. Value ($)</label><input type="number" id="currentValue" class="form-control"></div>
                </div>
                <div class="form-group"><label>Description</label><textarea id="description" rows="2" class="form-control"></textarea></div>
                <div class="form-group"><label>Notes on Issues</label><textarea id="notesOnIssues" rows="2" class="form-control"></textarea></div>
                
                <div class="form-group">
                    <label>Photos</label>
                    <input type="file" id="imageInput" accept="image/*" multiple class="form-control">
                </div>

                <div class="form-group">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                        <label>Custom Specifications</label>
                        <button type="button" onclick="addCustomRow()" style="background:none; border:none; color:var(--primary); font-weight:600; cursor:pointer;">+ Add Field</button>
                    </div>
                    <div id="customContainer"></div>
                </div>

                <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:16px;">
                    <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn">Save Watch</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let watches = JSON.parse(localStorage.getItem('watches') || '[]');
        let activeFilter = 'All';
        let currentImages = [];

        document.getElementById('addWatchBtn').addEventListener('click', function() {
            document.getElementById('watchForm').reset();
            document.getElementById('watchId').value = '';
            document.getElementById('customContainer').innerHTML = '';
            currentImages = [];
            document.getElementById('modalTitle').innerText = 'Add New Watch';
            document.getElementById('watchModal').classList.add('open');
        });

        function closeModal() {
            document.getElementById('watchModal').classList.remove('open');
        }

        function addCustomRow(k = '', v = '') {
            const div = document.createElement('div');
            div.className = 'custom-row';
            div.innerHTML = `
                <input type="text" placeholder="Key" value="${k}" class="form-control c-key" style="flex:1;">
                <input type="text" placeholder="Value" value="${v}" class="form-control c-val" style="flex:1;">
                <button type="button" onclick="this.parentElement.remove()" style="background:none; border:none; color:var(--danger); font-weight:bold;">&times;</button>
            `;
            document.getElementById('customContainer').appendChild(div);
        }

        document.getElementById('imageInput').addEventListener('change', function(e) {
            const files = e.target.files;
            for (let f of files) {
                const r = new FileReader();
                r.onload = function(evt) { currentImages.push(evt.target.result); }
                r.readAsDataURL(f);
            }
        });

        document.getElementById('watchForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const id = document.getElementById('watchId').value;
            
            const customFields = {};
            const keys = document.querySelectorAll('.c-key');
            const vals = document.querySelectorAll('.c-val');
            keys.forEach((k, i) => {
                if (k.value.trim()) customFields[k.value.trim()] = vals[i].value.trim();
            });

            const watch = {
                id: id ? Number(id) : Date.now(),
                brand: document.getElementById('brand').value,
                model: document.getElementById('model').value,
                category: document.getElementById('
span>Serial Number (Private by default)</span></label>
                <label class="flex items-center space-x-3 text-sm"><input type="checkbox" id="chk_price" class="rounded text-indigo-600"><span>Purchase Price</span></label>
                <label class="flex items-center space-x-3 text-sm"><input type="checkbox" id="chk_value" checked class="rounded text-indigo-600"><span>Current Value</span></label>
                <label class="flex items-center space-x-3 text-sm"><input type="checkbox" id="chk_desc" checked class="rounded text-indigo-600"><span>Description</span></label>
                <label class="flex items-center space-x-3 text-sm"><input type="checkbox" id="chk_notes" class="rounded text-indigo-600"><span>Notes on Issues</span></label>
            </div>
            <div class="flex justify-end space-x-3">
                <button onclick="closeShareModal()" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100">Cancel</button>
                <button onclick="generateShareText()" class="px-4 py-2 rounded-lg text-sm font-medium bg-indigo-600 hover:bg-indigo-700 text-white shadow">Generate & Share</button>
            </div>
        </div>
    </div>

    <script>
        let watches = JSON.parse(localStorage.getItem('watches') || '[]');
        let currentFilter = 'All';
        let currentImages = [];
        let sharingWatchId = null;

        function saveToStorage() {
            localStorage.setItem('watches', JSON.stringify(watches));
            renderWatches();
        }

        function filterCategory(cat) {
            currentFilter = cat;
            document.querySelectorAll('.category-btn').forEach(btn => {
                if (btn.innerText === cat) {
                    btn.className = "category-btn px-4 py-1.5 rounded-full text-sm font-medium bg-slate-900 text-white whitespace-nowrap shadow-sm";
                } else {
                    btn.className = "category-btn px-4 py-1.5 rounded-full text-sm font-medium bg-white text-slate-600 border border-slate-200 whitespace-nowrap shadow-sm";
                }
            });
            renderWatches();
        }

        function renderWatches() {
            const grid = document.getElementById('watchGrid');
            const filtered = currentFilter === 'All' ? watches : watches.filter(w => w.category === currentFilter);
            
            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 text-sm">No watches found in this category. Tap '+ Add Watch' to start your collection.</div>`;
                return;
            }

            grid.innerHTML = filtered.map(w => `
                <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden flex flex-col justify-between">
                    <div>
                        ${w.images && w.images.length > 0 ? `
                            <div class="h-48 bg-slate-100 overflow-hidden relative">
                                <img src="${w.images[0]}" class="w-full h-full object-cover">
                                ${w.images.length > 1 ? `<span class="absolute bottom-2 right-2 bg-black/60 text-white text-xs px-2 py-0.5 rounded-full">+${w.images.length - 1} more</span>` : ''}
                            </div>
                        ` : `<div class="h-32 bg-slate-100 flex items-center justify-center text-slate-400 text-xs font-medium">No Image</div>`}
                        <div class="p-4">
                            <div class="flex justify-between items-start mb-1">
                                <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-indigo-50 text-indigo-700">${w.category}</span>
                                <span class="text-sm font-bold text-slate-900">$${w.currentValue || 0}</span>
                            </div>
                            <h3 class="text-base font-bold text-slate-900">${w.brand} ${w.model}</h3>
                            <p class="text-xs text-slate-500 mb-2">${w.movementType || 'Standard Movement'}</p>
                            <p class="text-xs text-slate-600 line-clamp-2">${w.description || 'No description provided.'}</p>
                        </div>
                    </div>
                    <div class="px-4 py-3 bg-slate-50 border-t border-slate-100 flex justify-between items-center">
                        <button onclick="openShareModal(${w.id})" class="text-xs font-semibold text-indigo-600 hover:text-indigo-800">Share Report</button>
                        <div class="flex space-x-2">
                            <button onclick="editWatch(${w.id})" class="text-xs font-medium text-slate-600 hover:text-slate-900">Edit</button>
                            <button onclick="deleteWatch(${w.id})" class="text-xs font-medium text-rose-600 hover:text-rose-800">Delete</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function handleImages(event) {
            const files = event.target.files;
            for (let file of files) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentImages.push(e.target.result);
                    renderImagePreviews();
                }
                reader.readAsDataURL(file);
            }
        }

        function renderImagePreviews() {
            const container = document.getElementById('imagePreviewContainer');
            container.innerHTML = currentImages.map((img, idx) => `
                <div class="relative w-16 h-16 rounded-lg overflow-hidden border border-slate-200 flex-shrink-0">
                    <img src="${img}" class="w-full h-full object-cover">
                    <button type="button" onclick="currentImages.splice(${idx},1);renderImagePreviews()" class="absolute top-0 right-0 bg-rose-600 text-white text-[10px] w-4 h-4 flex items-center justify-center rounded-bl">&times;</button>
                </div>
            `).join('');
        }

        function addCustomFieldRow(key = '', val = '') {
            const container = document.getElementById('customFieldsContainer');
            const div = document.createElement('div');
            div.className = "flex space-x-2";
            div.innerHTML = `
                <input type="text" placeholder="Field Name" value="${key}" class="custom-key w-1/2 bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs outline-none">
                <input type="text" placeholder="Value" value="${val}" class="custom-val w-1/2 bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs outline-none">
                <button type="button" onclick="this.parentElement.remove()" class="text-rose-500 text-xs px-2">&times;</button>
            `;
            container.appendChild(div);
        }

        function openAddModal() {
            document.getElementById('modalTitle').innerText = "Add New Watch";
            document.getElementById('watchForm').reset();
            document.getElementById('watchId').value = "";
            currentImages = [];
            document.getElementById('imagePreviewContainer').innerHTML = "";
            document.getElementById('customFieldsContainer').innerHTML = "";
            document.getElementById('watchModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('watchModal').classList.add('hidden');
        }

        function editWatch(id) {
            const w = watches.find(item => item.id === id);
            if (!w) return;
            document.getElementById('modalTitle').innerText = "Edit Watch";
            document.getElementById('watchId').value = w.id;
            document.getElementById('brand').value = w.brand || '';
            document.getElementById('model').value = w.model || '';
            document.getElementById('category').value = w.category || 'Diver';
            document.getElementById('movementType').value = w.movementType || '';
            document.getElementById('serialNumber').value = w.serialNumber || '';
            document.getElementById('purchaseDate').value = w.purchaseDate || '';
            document.getElementById('purchasePrice').value = w.purchasePrice || '';
            document.getElementById('currentValue').value = w.currentValue || '';
            document.getElementById('description').value = w.description || '';
            document.getElementById('notesOnIssues').value = w.notesOnIssues || '';
            
            currentImages = w.images || [];
            renderImagePreviews();

            const customContainer = document.getElementById('customFieldsContainer');
            customContainer.innerHTML = "";
            if (w.customFields) {
                for (let [k, v] of Object.entries(w.customFields)) {
                    addCustomFieldRow(k, v);
                }
            }
            document.getElementById('watchModal').classList.remove('hidden');
        }

        function saveWatch(event) {
            event.preventDefault();
            const id = document.getElementById('watchId').value;
            
            const customFields = {};
            const keys = document.querySelectorAll('.custom-key');
            const vals = document.querySelectorAll('.custom-val');
            keys.forEach((k, idx) => {
                if (k.value.trim()) customFields[k.value.trim()] = vals[idx].value.trim();
            });

            const watchData = {
                id: id ? Number(id) : Date.now(),
                brand: document.getElementById('brand').value,
                model: document.getElementById('model').value,
                category: document.getElementById('category').value,
                movementType: document.getElementById('movementType').value,
                serialNumber: document.getElementById('serialNumber').value,
                purchaseDate: document.
