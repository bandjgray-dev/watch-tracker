<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Vault</title>
    
    <!-- PWA Manifest & Mobile Icons -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#020617">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Watch Vault">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2972/2972531.png">

<body class="bg-slate-950 text-slate-100 min-h-screen pb-12 font-sans antialiased">

        <!-- Top Header & Actions -->

            </button>

            <button onclick="setFilter('Dress', this)" class="filter-btn bg-slate-900 text-slate-400 hover:text-slate-200 text-xs font-semibold px-4 py-2 rounded-full whitespace-nowrap border border-slate-800 shadow-sm transition-all">Dress</button>
            <button onclick="setFilter('Chronograph', this)" class="filter-btn bg-slate-900 text-slate-400 hover:text-slate-200 text-xs font-semibold px-4 py-2 rounded-full whitespace-nowrap border border-slate-800 shadow-sm transition-all">Chronograph</button>
            <button onclick="setFilter('Field', this)" class="filter-btn bg-slate-900 text-slate-400 hover:text-slate-200 text-xs font-semibold px-4 py-2 rounded-full whitespace-nowrap border border-slate-800 shadow-sm transition-all">Field</button>
            <button onclick="setFilter('Vintage', this)" class="filter-btn bg-slate-900 text-slate-400 hover:text-slate-200 text-xs font-semibold px-4 py-2 rounded-full whitespace-nowrap border border-slate-800 shadow-sm transition-all">Vintage</button>

    </div>
    <!-- Add / Edit Watch Modal -->

                        <input type="text" id="waterResistance" placeholder="300m" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Case Material</label>
                        <input type="text" id="caseMaterial" placeholder="Stainless Steel" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">

                        <input type="date" id="purchaseDate" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">

                    <input type="text" id="dateOfManufacture" placeholder="2022" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">

    <!-- Expanded Detail Modal -->
    <div id="detailModal" class="hidden fixed inset-0 bg-black/85 backdrop-blur-sm z-50 items-center justify-center p-4 overflow-y-auto">

    <!-- Share Modal -->
    <div id="shareModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 text-slate-100 rounded-3xl w-full max-w-sm p-6 shadow-2xl space-y-4">
            <h3 class="text-base font-bold text-white">Share / Export Options</h3>
            <div id="shareOptionsBox" class="space-y-2 max-h-48 overflow-y-auto text-xs text-slate-300 pr-1"></div>
            <div class="flex flex-col gap-2 pt-2">
                <button type="button" onclick="executeShareText()" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-semibold text-xs py-2.5 rounded-xl">Share Text (SMS / App)</button>
                <button type="button" onclick="executeEmailReport()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs py-2.5 rounded-xl">Email Details</button>
                <button type="button" onclick="executeGeneratePDF()" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-semibold text-xs py-2.5 rounded-xl">Download PDF Report</button>

    <script>
        // Register Service Worker for Mobile PWA Installation
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('./sw.js').then(function(reg) {
                    console.log('PWA Service Worker active:', reg.scope);
                }).catch(function(err) {
                    console.error('Service Worker registration failed:', err);
                });
            });
        }

        var watches = [];
        var currentTempImages = [];
        var activeCategoryFilter = 'All';
        var activeShareWatchId = null;

        var defaultWatches = [
            {
                id: 101,
                brand: "Rolex",
                model: "Submariner Date",
                refNumber: "126610LN",
                category: "Diver",
                currentValue: "14500",
                movementType: "Automatic (3235)",
                serialNumber: "X829F114",
                caseSize: "41mm",
                lugWidth: "20mm",
                crystalType: "Sapphire",
                bandMaterial: "Steel Oyster",
                waterResistance: "300m",
                caseMaterial: "Stainless Steel",
                purchaseDate: "2023-01-15",
                purchasePrice: "10200",
                askingPrice: "14500",
                dateOfManufacture: "2022",
                description: "Black dial, Cerachrom bezel. Daily driver.",
                images: ["https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600&auto=format&fit=crop&q=80"]
            }
        ];

        function openIDB() {
            return new Promise(function(resolve, reject) {
                var request = indexedDB.open('WatchVaultMassiveDB', 1);
                request.onupgradeneeded = function(e) {
                    var db = e.target.result;
                    if (!db.objectStoreNames.contains('vault')) {
                        db.createObjectStore('vault');
                    }
                };
                request.onsuccess = function(e) { resolve(e.target.result); };
                request.onerror = function(e) { reject(e.target.error); };
            });
        }

        async function loadVaultData() {
            try {
                var db = await openIDB();
                var tx = db.transaction('vault', 'readonly');
                var store = tx.objectStore('vault');
                var req = store.get('watch_collection');
                req.onsuccess = function() {
                    var data = req.result;
                    if (data && Array.isArray(data) && data.length > 0) {
                        watches = data;
                    } else {
                        watches = defaultWatches;
                        saveVaultData();
                    }
                    render();
                };
                req.onerror = function() {
                    watches = defaultWatches;
                    render();
                };
            } catch(err) {
                watches = defaultWatches;
                render();
            }
        }

        async function saveVaultData() {
            try {
                var db = await openIDB();
                var tx = db.transaction('vault', 'readwrite');
                var store = tx.objectStore('vault');
                store.put(watches, 'watch_collection');
            } catch(err) {
                console.error("IndexedDB save error:", err);
            }
        }

        loadVaultData();
    </script>
    <script>
        function openModal() {
            document.getElementById('modalTitle').innerText = 'Add Watch';
            document.getElementById('watchId').value = '';
            document.getElementById('watchForm').reset();
            currentTempImages = [];
            renderTempImagePreviews();
            document.getElementById('modalDeleteBtn').classList.add('hidden');
            document.getElementById('watchModal').classList.remove('hidden');
            document.getElementById('watchModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('watchModal').classList.add('hidden');
            document.getElementById('watchModal').classList.remove('flex');
        }

        function setFilter(category, element) {
            activeCategoryFilter = category;
            document.querySelectorAll('.filter-btn').forEach(function(btn) {
                btn.className = 'filter-btn bg-slate-900 text-slate-400 hover:text-slate-200 text-xs font-semibold px-4 py-2 rounded-full whitespace-nowrap border border-slate-800 shadow-sm transition-all';
            });
            element.className = 'filter-btn active bg-indigo-600 text-white text-xs font-semibold px-4 py-2 rounded-full whitespace-nowrap border border-indigo-500 shadow-sm transition-all';
            render();
        }

        function compressImage(file, callback) {
            var reader = new FileReader();
            reader.onload = function (e) {
                var img = new Image();
                img.onload = function () {
                    var canvas = document.createElement('canvas');
                    var maxWidth = 800;
                    var maxHeight = 800;
                    var width = img.width;
                    var height = img.height;

                    if (width > height) {
                        if (width > maxWidth) {
                            height *= maxWidth / width;
                            width = maxWidth;
                        }
                    } else {
                        if (height > maxHeight) {
                            width *= maxHeight / height;
                            height = maxHeight;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    var ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    var compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
                    callback(compressedDataUrl);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function handleImgs(e) {
            var files = e.target.files;
            if (!files.length) return;
            for (var i = 0; i < files.length; i++) {
                compressImage(files[i], function(compressedResult) {
                    currentTempImages.push(compressedResult);
                    renderTempImagePreviews();
                });
            }
        }

        function renderTempImagePreviews() {
            var container = document.getElementById('imagePreviewContainer');
            if(!container) return;
            container.innerHTML = currentTempImages.map(function(imgSrc, index) {
                return '<div class="relative w-12 h-12 flex-shrink-0 rounded-lg overflow-hidden border border-slate-700">' +
                    '<img src="' + imgSrc + '" class="w-full h-full object-cover">' +
                    '<button type="button" onclick="removeTempImage(' + index + ')" class="absolute top-0 right-0 bg-red-600 text-white w-4 h-4 rounded-bl flex items-center justify-center text-[10px] font-bold">&times;</button>' +
                '</div>';
            }).join('');
        }

        function removeTempImage(index) {
            currentTempImages.splice(index, 1);
            renderTempImagePreviews();
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            
            var fileInput = document.getElementById('imgs');
            if (fileInput && fileInput.files && fileInput.files.length > 0) {
                var filePromises = Array.from(fileInput.files).map(function(file) {
                    return new Promise(function(resolve) {
                        compressImage(file, function(compressed) {
                            resolve(compressed);
                        });
                    });
                });
                var loadedImgs = await Promise.all(filePromises);
                loadedImgs.forEach(function(img) {
                    if (!currentTempImages.includes(img)) currentTempImages.push(img);
                });
            }

            var id = document.getElementById('watchId').value;

            var watchData = {
                id: id ? Number(id) : Date.now(),
                brand: document.getElementById('brand').value,
                model: document.getElementById('model').value,
                refNumber: document.getElementById('refNumber').value,
                category: document.getElementById('category').value,
                currentValue: document.getElementById('currentValue').value,
                movementType: document.getElementById('movementType').value,
                serialNumber: document.getElementById('serialNumber').value,
                caseSize: document.getElementById('caseSize').value,
                lugWidth: document.getElementById('lugWidth').value,
                crystalType: document.getElementById('crystalType').value,
                bandMaterial: document.getElementById('bandMaterial').value,
                waterResistance: document.getElementById('waterResistance').value,
                caseMaterial: document.getElementById('caseMaterial').value,
                purchaseDate: document.getElementById('purchaseDate').value,
                purchasePrice: document.getElementById('purchasePrice').value,
                askingPrice: document.getElementById('askingPrice').value,
                dateOfManufacture: document.getElementById('dateOfManufacture').value,
                description: document.getElementById('description').value,
                images: currentTempImages
            };

            if (id) {
                var idx = watches.findIndex(function(w) { return w.id === Number(id); });
                if (idx !== -1) watches[idx] = watchData;
            } else {
                watches.push(watchData);
            }

            await saveVaultData();
            closeModal();
            render();
        }
    </script>
    <script>
        function openDetailModal(id) {
            var w = watches.find(function(item) { return item.id === id; });
            if (!w) return;

            var titleStr = (w.brand || '') + (w.model ? ' ' + w.model : '');
            document.getElementById('detTitle').innerText = titleStr;
            document.getElementById('detVal').innerText = w.currentValue ? '$' + Number(w.currentValue).toLocaleString() : '$0';
            document.getElementById('detMovement').innerText = w.movementType || 'N/A';
            document.getElementById('detRefNumber').innerText = w.refNumber || 'N/A';
            document.getElementById('detSerial').innerText = w.serialNumber || 'N/A';
            document.getElementById('detDesc').innerText = w.description || 'No notes provided.';

            var specSec = document.getElementById('detSpecsSection');
            var specsData = [
                { label: 'Case Size', val: w.caseSize },
                { label: 'Lug Width', val: w.lugWidth },
                { label: 'Crystal', val: w.crystalType },
                { label: 'Band Material', val: w.bandMaterial },
                { label: 'Water Resistance', val: w.waterResistance },
                { label: 'Case Material', val: w.caseMaterial },
                { label: 'Purchase Date', val: w.purchaseDate },
                { label: 'Purchase Price', val: w.purchasePrice ? '$' + Number(w.purchasePrice).toLocaleString() : null },
                { label: 'Asking Price', val: w.askingPrice ? '$' + Number(w.askingPrice).toLocaleString() : null },
                { label: 'Mfg Date', val: w.dateOfManufacture }
            ].filter(function(s) { return s.val; });

            if (specsData.length) {
                specSec.innerHTML = '<h4 class="text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-1 mt-3">Additional Specifications</h4>' +
                    '<div class="grid grid-cols-2 gap-1.5 bg-slate-950 p-3 rounded-2xl border border-slate-800/80 text-xs">' +
                    specsData.map(function(s) {
                        return '<div><span class="text-slate-500 block uppercase text-[9px] font-bold">' + s.label + '</span><span class="text-slate-200">' + s.val + '</span></div>';
                    }).join('') + '</div>';
            } else {
                specSec.innerHTML = '';
            }

            var imgContainer = document.getElementById('detImagesContainer');
            if (w.images && w.images.length) {
                imgContainer.innerHTML = w.images.map(function(img) {
                    return '<img src="' + img + '" onclick="openLightbox(\'' + img + '\')" class="w-32 h-32 object-cover rounded-xl border border-slate-800 flex-shrink-0 cursor-pointer hover:opacity-90 transition-opacity" title="Tap to enlarge">';
                }).join('');
                imgContainer.classList.remove('hidden');
            } else {
                imgContainer.innerHTML = '';
                imgContainer.classList.add('hidden');
            }

            document.getElementById('detEditBtn').onclick = function() { closeDetailModal(); editWatch(w.id); };
            document.getElementById('detShareBtn').onclick = function() { closeDetailModal(); openShareModal(w.id); };

            document.getElementById('detailModal').classList.remove('hidden');
            document.getElementById('detailModal').classList.add('flex');
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.add('hidden');
            document.getElementById('detailModal').classList.remove('flex');
        }

        function openLightbox(imgSrc) {
            document.getElementById('lightboxImg').src = imgSrc;
            var box = document.getElementById('lightboxModal');
            box.classList.remove('hidden');
            box.classList.add('flex');
        }

        function closeLightbox() {
            var box = document.getElementById('lightboxModal');
            box.classList.add('hidden');
            box.classList.remove('flex');
        }

        function editWatch(id) {
            var w = watches.find(function(item) { return item.id === id; });
            if (!w) return;
            document.getElementById('modalTitle').innerText = 'Edit Watch';
            document.getElementById('watchId').value = w.id;
            document.getElementById('brand').value = w.brand || '';
            document.getElementById('model').value = w.model || '';
            document.getElementById('refNumber').value = w.refNumber || '';
            document.getElementById('category').value = w.category || 'Diver';
            document.getElementById('currentValue').value = w.currentValue || '';
            document.getElementById('movementType').value = w.movementType || '';
            document.getElementById('serialNumber').value = w.serialNumber || '';
            document.getElementById('caseSize').value = w.caseSize || '';
            document.getElementById('lugWidth').value = w.lugWidth || '';
            document.getElementById('crystalType').value = w.crystalType || '';
            document.getElementById('bandMaterial').value = w.bandMaterial || '';
            document.getElementById('waterResistance').value = w.waterResistance || '';
            document.getElementById('caseMaterial').value = w.caseMaterial || '';
            document.getElementById('purchaseDate').value = w.purchaseDate || '';
            document.getElementById('purchasePrice').value = w.purchasePrice || '';
            document.getElementById('askingPrice').value = w.askingPrice || '';
            document.getElementById('dateOfManufacture').value = w.dateOfManufacture || '';
            document.getElementById('description').value = w.description || '';

            currentTempImages = w.images ? [...w.images] : [];
            renderTempImagePreviews();
            
            // Show delete button inside edit modal
            document.getElementById('modalDeleteBtn').classList.remove('hidden');

            document.getElementById('watchModal').classList.remove('hidden');
            document.getElementById('watchModal').classList.add('flex');
        }

        async function deleteCurrentEditingWatch() {
            var id = document.getElementById('watchId').value;
            if (!id) return;
            if (confirm("Delete this watch record?")) {
                watches = watches.filter(function(w) { return w.id !== Number(id); });
                await saveVaultData();
                closeModal();
                render();
            }
        }

        async function moveWatch(id, direction) {
            var index = watches.findIndex(function(w) { return w.id === id; });
            if (index === -1) return;
            
            var targetIndex = index + direction;
            if (targetIndex < 0 || targetIndex >= watches.length) return;

            var item = watches.splice(index, 1)[0];
            watches.splice(targetIndex, 0, item);

            await saveVaultData();
            render();
        }

        function openShareModal(id) {
            activeShareWatchId = id;
            var w = watches.find(function(item) { return item.id === id; });
            if (!w) return;
            var box = document.getElementById('shareOptionsBox');
            var html = '';
            var items = [
                { id: 'sb_brand', label: 'Watch Name', val: (w.brand || '') + (w.model ? ' ' + w.model : ''), def: true },
                { id: 'sb_ref', label: 'Ref No.', val: w.refNumber, def: true },
                { id: 'sb_cat', label: 'Category', val: w.category, def: true },
                { id: 'sb_val', label: 'Estimated Value', val: '$' + (w.currentValue || 'N/A'), def: true },
                { id: 'sb_mov', label: 'Movement', val: w.movementType, def: true },
                { id: 'sb_sn', label: 'Serial No.', val: w.serialNumber, def: false },
                { id: 'sb_desc', label: 'Notes', val: w.description, def: false }
            ];
            items.forEach(function(item) {
                if (item.val && item.val !== '$N/A' && item.val !== 'N/A') {
                    html += '<label class="flex items-center gap-2 cursor-pointer hover:text-white"><input type="checkbox" id="' + item.id + '" ' + (item.def ? 'checked' : '') + ' class="rounded accent-indigo-600"><span>' + item.label + ': ' + item.val + '</span></label>';
                }
            });
            box.innerHTML = html;
            document.getElementById('shareModal').classList.remove('hidden');
            document.getElementById('shareModal').classList.add('flex');
        }

        function closeShareModal() {
            document.getElementById('shareModal').classList.add('hidden');
            document.getElementById('shareModal').classList.remove('flex');
        }

        function buildShareTextPayload() {
            var w = watches.find(function(item) { return item.id === activeShareWatchId; });
            if (!w) return '';
            var txt = "⌚ Watch Details Report\n";
            if (document.getElementById('sb_brand') && document.getElementById('sb_brand').checked) txt += "Watch: " + (w.brand || '') + (w.model ? ' ' + w.model : '') + "\n";
            if (document.getElementById('sb_ref') && document.getElementById('sb_ref').checked) txt += "Ref No.: " + (w.refNumber || 'N/A') + "\n";
            if (document.getElementById('sb_cat') && document.getElementById('sb_cat').checked) txt += "Category: " + (w.category || '') + "\n";
            if (document.getElementById('sb_val') && document.getElementById('sb_val').checked) txt += "Est. Value: $" + (w.currentValue || 'N/A') + "\n";
            if (document.getElementById('sb_mov') && document.getElementById('sb_mov').checked) txt += "Movement: " + (w.movementType || 'N/A') + "\n";
            if (document.getElementById('sb_sn') && document.getElementById('sb_sn').checked) txt += "Serial: " + (w.serialNumber || 'N/A') + "\n";
            if (document.getElementById('sb_desc') && document.getElementById('sb_desc').checked) txt += "Notes: " + (w.description || 'None') + "\n";
            return txt;
        }

        function executeShareText() {
            var w = watches.find(function(item) { return item.id === activeShareWatchId; });
            var txt = buildShareTextPayload();
            closeShareModal();
            var titleStr = (w.brand || '') + (w.model ? ' ' + w.model : '');
            if (navigator.share) navigator.share({ title: titleStr, text: txt });
            else prompt("Copy report to share:", txt);
        }

        function executeEmailReport() {
            var w = watches.find(function(item) { return item.id === activeShareWatchId; });
            var txt = buildShareTextPayload();
            closeShareModal();
            var titleStr = (w.brand || '') + (w.model ? ' ' + w.model : '');
            window.location.href = "mailto:?subject=" + encodeURIComponent("Watch Specification: " + titleStr) + "&body=" + encodeURIComponent(txt);
        }

        function executeGeneratePDF() {
            var w = watches.find(function(item) { return item.id === activeShareWatchId; });
            if (!w) return;
            var titleStr = (w.brand || '') + (w.model ? ' ' + w.model : '');
            var pdfHtml = '<div style="font-family:sans-serif; padding:20px; max-width:600px; margin:auto;">' +
                '<h1 style="border-bottom:2px solid #cbd5e1; padding-bottom:8px; color:#0f172a;">Watch Vault Record Report</h1>' +
                '<h2 style="color:#475569; margin-top:16px;">' + titleStr + '</h2>' +
                '<p><strong>Reference No.:</strong> ' + (w.refNumber || 'N/A') + '</p>' +
                '<p><strong>Category:</strong> ' + (w.category || 'N/A') + '</p>' +
                '<p><strong>Estimated Value:</strong> $' + (w.currentValue || 'N/A') + '</p>' +
                '<p><strong>Movement:</strong> ' + (w.movementType || 'N/A') + '</p>' +
                '<p><strong>Serial Number:</strong> ' + (w.serialNumber || 'N/A') + '</p></div>';
            closeShareModal();
            var win = window.open('', '', 'width=700,height=700');
            win.document.write('<html><head><title>Watch Report</title></head><body>' + pdfHtml + '</body></html>');
            win.document.close();
            win.focus();
            setTimeout(function() { win.print(); }, 500);
        }

        function exportBackup() {
            var dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(watches, null, 2));
            var dl = document.createElement('a');
            dl.setAttribute("href", dataStr);
            dl.setAttribute("download", "watch_vault_backup_" + new Date().toISOString().slice(0, 10) + ".json");
            document.body.appendChild(dl);
            dl.click();
            dl.remove();
        }

        function importBackup(e) {
            var file = e.target.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = async function(evt) {
                try {
                    var parsed = JSON.parse(evt.target.result);
                    if (Array.isArray(parsed)) {
                        if (confirm("Import " + parsed.length + " watches into your collection?")) {
                            watches = parsed;
                            await saveVaultData();
                            render();
                            alert("Collection imported!");
                        }
                    }
                } catch (err) { alert("Invalid JSON backup file format."); }
            };
            reader.readAsText(file);
        }

        function render() {
            var list = document.getElementById('watchList');
            if (!list) return;

            var filtered = activeCategoryFilter === 'All' ? watches : watches.filter(function(w) { return w.category === activeCategoryFilter; });

            if (!filtered || !filtered.length) {
                list.innerHTML = '<div class="text-center py-12 text-slate-500 text-xs font-medium bg-slate-900 border border-slate-800 rounded-2xl">No watches found in this category.</div>';
                return;
            }

            list.innerHTML = filtered.map(function(w, idx) {
                var imgCover = (w.images && w.images.length) ? '<img src="' + w.images[0] + '" class="w-full h-44 object-cover cursor-pointer" onclick="openDetailModal(' + w.id + ')">' : '';
                var displayTitle = (w.brand || '') + (w.model ? ' ' + w.model : '');

                var moveButtons = activeCategoryFilter === 'All' ? 
                    '<div class="flex gap-1 bg-slate-950 p-1 rounded-lg border border-slate-800">' +
                        '<button onclick="moveWatch(' + w.id + ', -1)" ' + (idx === 0 ? 'disabled class="text-slate-700 px-1.5 text-xs cursor-not-allowed"' : 'class="text-slate-300 hover:text-white px-1.5 text-xs"') + '>↑</button>' +
                        '<button onclick="moveWatch(' + w.id + ', 1)" ' + (idx === filtered.length - 1 ? 'disabled class="text-slate-700 px-1.5 text-xs cursor-not-allowed"' : 'class="text-slate-300 hover:text-white px-1.5 text-xs"') + '>↓</button>' +
                    '</div>' : '';

                return '<div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-lg transition-all hover:border-slate-700">' +
                    imgCover +
                    '<div class="p-4 space-y-2 cursor-pointer" onclick="openDetailModal(' + w.id + ')">' +
                        '<div class="flex justify-between items-center">' +
                            '<span class="bg-indigo-950/80 text-indigo-300 text-[10px] font-bold px-2.5 py-1 rounded-full border border-indigo-800/50">' + (w.category || 'General') + '</span>' +
                            '<span class="text-emerald-400 font-bold text-sm">' + (w.currentValue ? '$' + Number(w.currentValue).toLocaleString() : '$0') + '</span>' +
                        '</div>' +
                        '<h3 class="text-base font-bold text-white hover:text-indigo-400">' + displayTitle + '</h3>' +
                        (w.refNumber ? '<p class="text-xs text-indigo-300/80 font-mono">Ref: ' + w.refNumber + '</p>' : '') +
                        '<p class="text-xs text-slate-400 leading-relaxed line-clamp-2">' + (w.description || 'No description provided.') + '</p>' +
                    '</div>' +
                    '<div class="flex justify-between items-center px-4 pb-4 pt-2 border-t border-slate-800/80">' +
                        '<div class="flex gap-1.5 items-center">' +
                            '<button onclick="editWatch(' + w.id + ')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold px-3 py-1.5 rounded-lg transition-all">Edit</button>' +
                            '<button onclick="openShareModal(' + w.id + ')" class="bg-indigo-900/40 hover:bg-indigo-900/60 text-indigo-300 text-xs font-semibold px-3 py-1.5 rounded-lg border border-indigo-800/50 transition-all">Share / PDF</button>' +
                        '</div>' +
                        '<div>' + moveButtons + '</div>' +
                    '</div>' +
                '</div>';
            }).join('');
        }
    </script>
</body>
</html>
