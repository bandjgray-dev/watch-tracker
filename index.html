<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-12 font-sans antialiased">
    <div class="max-w-md mx-auto px-4 py-4 space-y-4">

        <!-- Top Header & Actions -->
        <header class="flex items-center justify-between bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-lg">
            <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent flex items-center gap-2">
                <span>⌚</span> Watch Vault
            </h1>
            <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs px-4 py-2 rounded-full shadow-md active:scale-95 transition-all">
                + Add Watch
            </button>
        </header>

        <!-- Backup & Restore Bar -->
        <div class="grid grid-cols-2 gap-2">
            <button onclick="exportBackup()" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 font-medium text-xs py-2 rounded-xl text-center active:scale-95 transition-all">
                📥 Export Backup
            </button>
            <button onclick="document.getElementById('importFile').click()" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 font-medium text-xs py-2 rounded-xl text-center active:scale-95 transition-all">
                📤 Restore Backup
            </button>
            <input type="file" id="importFile" accept=".json" class="hidden" onchange="importBackup(event)">
        </div>

        <!-- Horizontal Scroll Category Bar -->
        <div class="flex gap-2 overflow-x-auto no-scrollbar py-1" id="catFilters">
            <button onclick="setFilter('All', this)" class="filter-btn active bg-indigo-600 text-white text-xs font-semibold px-4 py-2 rounded-full whitespace-nowrap border border-indigo-500 shadow-sm transition-all">All</button>
            <button onclick="setFilter('Diver', this)" class="filter-btn bg-slate-900 text-slate-400 hover:text-slate-200 text-xs font-semibold px-4 py-2 rounded-full whitespace-nowrap border border-slate-800 shadow-sm transition-all">Diver</button>
            <button onclick="setFilter('Dress', this)" class="filter-btn bg-slate-900 text-slate-400 hover:text-slate-200 text-xs font-semibold px-4 py-2 rounded-full whitespace-nowrap border border-slate-800 shadow-sm transition-all">Dress</button>
            <button onclick="setFilter('Chronograph', this)" class="filter-btn bg-slate-900 text-slate-400 hover:text-slate-200 text-xs font-semibold px-4 py-2 rounded-full whitespace-nowrap border border-slate-800 shadow-sm transition-all">Chronograph</button>
            <button onclick="setFilter('Field', this)" class="filter-btn bg-slate-900 text-slate-400 hover:text-slate-200 text-xs font-semibold px-4 py-2 rounded-full whitespace-nowrap border border-slate-800 shadow-sm transition-all">Field</button>
            <button onclick="setFilter('Vintage', this)" class="filter-btn bg-slate-900 text-slate-400 hover:text-slate-200 text-xs font-semibold px-4 py-2 rounded-full whitespace-nowrap border border-slate-800 shadow-sm transition-all">Vintage</button>
        </div>

        <!-- Watch Cards Container -->
        <div id="watchList" class="space-y-4"></div>
    </div>
        <!-- Add / Edit Watch Modal -->
    <div id="watchModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 items-center justify-center p-4 overflow-y-auto">
        <div class="bg-slate-900 border border-slate-800 text-slate-100 rounded-3xl w-full max-w-md max-h-[90vh] overflow-y-auto p-6 shadow-2xl">
            <h2 id="modalTitle" class="text-lg font-bold text-white mb-4">Add Watch</h2>
            <form id="watchForm" onsubmit="handleFormSubmit(event)" class="space-y-3">
                <input type="hidden" id="watchId">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Brand</label>
                        <input type="text" id="brand" required placeholder="Rolex" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Model</label>
                        <input type="text" id="model" required placeholder="Submariner" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Category</label>
                        <select id="category" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                            <option value="Diver">Diver</option>
                            <option value="Dress">Dress</option>
                            <option value="Chronograph">Chronograph</option>
                            <option value="Field">Field</option>
                            <option value="Vintage">Vintage</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Value ($)</label>
                        <input type="number" id="currentValue" placeholder="14500" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Movement</label>
                        <input type="text" id="movementType" placeholder="Automatic 3235" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Serial Number</label>
                        <input type="text" id="serialNumber" placeholder="X829F114" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Notes</label>
                    <textarea id="description" rows="2" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500"></textarea>
                </div>
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Images</label>
                    <input type="file" id="imgs" accept="image/*" multiple onchange="handleImgs(event)" class="w-full text-xs text-slate-400 file:mr-2 file:py-1 file:px-3 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500">
                    <div id="imagePreviewContainer" class="flex gap-2 overflow-x-auto py-2"></div>
                </div>
                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Custom Fields</label>
                        <button type="button" onclick="addCustomFieldRow()" class="text-xs text-indigo-400 font-semibold hover:text-indigo-300">+ Add Field</button>
                    </div>
                    <div id="customFieldsBox" class="space-y-2"></div>
                </div>
                <div class="flex justify-end gap-2 pt-3">
                    <button type="button" onclick="closeModal()" class="bg-slate-800 text-slate-300 font-semibold text-xs px-4 py-2.5 rounded-xl">Cancel</button>
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs px-5 py-2.5 rounded-xl shadow-md">Save Watch</button>
                </div>
            </form>
        </div>
    </div>
        <!-- Expanded Detail Modal -->
    <div id="detailModal" class="hidden fixed inset-0 bg-black/85 backdrop-blur-sm z-50 items-center justify-center p-4 overflow-y-auto">
        <div class="bg-slate-900 border border-slate-800 text-slate-100 rounded-3xl w-full max-w-md max-h-[90vh] overflow-y-auto p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-start">
                <div>
                    <span id="detCategory" class="bg-indigo-950/80 text-indigo-300 text-[10px] font-bold px-2.5 py-1 rounded-full border border-indigo-800/50"></span>
                    <h2 id="detTitle" class="text-xl font-bold text-white mt-1.5"></h2>
                </div>
                <button onclick="closeDetailModal()" class="bg-slate-800 text-slate-400 hover:text-white w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm">&times;</button>
            </div>
            
            <!-- Image Carousel / Gallery -->
            <div id="detImagesContainer" class="flex gap-2 overflow-x-auto no-scrollbar py-1"></div>

            <!-- Specs Grid -->
            <div class="grid grid-cols-2 gap-2 bg-slate-950 p-3 rounded-2xl border border-slate-800/80 text-xs">
                <div><span class="text-slate-500 block uppercase text-[9px] font-bold">Estimated Value</span><span id="detVal" class="text-emerald-400 font-bold text-sm"></span></div>
                <div><span class="text-slate-500 block uppercase text-[9px] font-bold">Movement</span><span id="detMovement" class="text-slate-200 font-medium"></span></div>
                <div class="col-span-2 pt-1 border-t border-slate-900"><span class="text-slate-500 block uppercase text-[9px] font-bold">Serial Number</span><span id="detSerial" class="text-slate-300 font-mono"></span></div>
            </div>

            <div>
                <h4 class="text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-1">Notes</h4>
                <p id="detDesc" class="text-xs text-slate-300 leading-relaxed bg-slate-950 p-3 rounded-2xl border border-slate-800/80"></p>
            </div>

            <div id="detCustomFieldsSection"></div>

            <div class="flex gap-2 pt-2">
                <button type="button" id="detEditBtn" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold text-xs py-2.5 rounded-xl transition-all">Edit Watch</button>
                <button type="button" id="detShareBtn" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs py-2.5 rounded-xl transition-all">Share / PDF</button>
            </div>
        </div>
    </div>

    <!-- Fullscreen Image Carousel Lightbox Modal with Swipe Support -->
    <div id="lightboxModal" class="hidden fixed inset-0 bg-black/95 z-[100] items-center justify-center p-4">
        <button onclick="closeLightbox()" class="absolute top-4 right-4 bg-slate-800 text-white w-10 h-10 rounded-full font-bold text-lg flex items-center justify-center shadow-lg z-10">&times;</button>
        
        <!-- Previous Arrow -->
        <button onclick="prevLightboxImage()" id="lightboxPrevBtn" class="absolute left-4 bg-slate-800/80 hover:bg-slate-700 text-white w-10 h-10 rounded-full font-bold text-lg flex items-center justify-center shadow-lg z-10">&#10094;</button>
        
        <!-- Current Image -->
        <img id="lightboxImg" src="" class="max-w-full max-h-[85vh] object-contain rounded-xl shadow-2xl select-none">

        <!-- Next Arrow -->
        <button onclick="nextLightboxImage()" id="lightboxNextBtn" class="absolute right-4 bg-slate-800/80 hover:bg-slate-700 text-white w-10 h-10 rounded-full font-bold text-lg flex items-center justify-center shadow-lg z-10">&#10095;</button>
        
        <!-- Image Index Counter Indicator -->
        <div id="lightboxCounter" class="absolute bottom-6 bg-slate-900/80 text-slate-300 text-xs px-3 py-1 rounded-full border border-slate-800"></div>
    </div>

    <!-- Share & PDF Report Modal -->
    <div id="shareModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 text-slate-100 rounded-3xl w-full max-w-sm p-6 shadow-2xl space-y-4">
            <h3 class="text-base font-bold text-white">Share / Export Options</h3>
            <div id="shareOptionsBox" class="space-y-2 max-h-48 overflow-y-auto text-xs text-slate-300 pr-1"></div>
            <div class="flex flex-col gap-2 pt-2">
                <button type="button" onclick="executeShareText()" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-semibold text-xs py-2.5 rounded-xl">Share Text (SMS / App)</button>
                <button type="button" onclick="executeEmailReport()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs py-2.5 rounded-xl">Email Details</button>
                <button type="button" onclick="executeGeneratePDF()" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-semibold text-xs py-2.5 rounded-xl">Download PDF Report</button>
                <button type="button" onclick="closeShareModal()" class="w-full bg-slate-950 text-slate-400 font-semibold text-xs py-2 rounded-xl mt-1">Cancel</button>
            </div>
        </div>
    </div>
        <script>
        var defaultWatches = [
            {
                id: 101,
                brand: "Rolex",
                model: "Submariner Date",
                category: "Diver",
                currentValue: "14500",
                movementType: "Automatic (3235)",
                serialNumber: "X829F114",
                description: "Black dial, Cerachrom bezel. Daily driver.",
                images: ["https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600&auto=format&fit=crop&q=80"],
                customFields: { "Water Resistance": "300m", "Case Diameter": "41mm" }
            },
            {
                id: 102,
                brand: "Omega",
                model: "Speedmaster Pro",
                category: "Chronograph",
                currentValue: "6800",
                movementType: "Manual (3861)",
                serialNumber: "78912345",
                description: "Hesalite Moonwatch with steel bracelet.",
                images: ["https://images.unsplash.com/photo-1547996160-81dfa63595aa?w=600&auto=format&fit=crop&q=80"],
                customFields: { "Lug Width": "20mm", "Crystal": "Hesalite" }
            }
        ];

        var stored = localStorage.getItem('watches_v2');
        var watches = stored ? JSON.parse(stored) : defaultWatches;
        if (!stored) localStorage.setItem('watches_v2', JSON.stringify(watches));

        var currentTempImages = [];
        var activeCategoryFilter = 'All';
        var activeShareWatchId = null;
        var lightboxImagesList = [];
        var lightboxCurrentIndex = 0;

        function openModal() {
            document.getElementById('modalTitle').innerText = 'Add Watch';
            document.getElementById('watchId').value = '';
            document.getElementById('watchForm').reset();
            currentTempImages = [];
            renderTempImagePreviews();
            document.getElementById('customFieldsBox').innerHTML = '';
            document.getElementById('watchModal').classList.remove('hidden');
            document.getElementById('watchModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('watchModal').classList.add('hidden');
            document.getElementById('watchModal').classList.remove('flex');
        }

        function setFilter(category, element) {
            activeCategoryFilter = category;
            document.querySelectorAll('.filter-btn').forEach(function(btn) {
                btn.className = 'filter-btn bg-slate-900 text-slate-400 hover:text-slate-200 text-xs font-semibold px-4 py-2 rounded-full whitespace-nowrap border border-slate-800 shadow-sm transition-all';
            });
            element.className = 'filter-btn active bg-indigo-600 text-white text-xs font-semibold px-4 py-2 rounded-full whitespace-nowrap border border-indigo-500 shadow-sm transition-all';
            render();
        }

        function compressImage(file, callback) {
            var reader = new FileReader();
            reader.onload = function (e) {
                var img = new Image();
                img.onload = function () {
                    var canvas = document.createElement('canvas');
                    var maxWidth = 800;
                    var maxHeight = 800;
                    var width = img.width;
                    var height = img.height;

                    if (width > height) {
                        if (width > maxWidth) {
                            height *= maxWidth / width;
                            width = maxWidth;
                        }
                    } else {
                        if (height > maxHeight) {
                            width *= maxHeight / height;
                            height = maxHeight;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    var ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    var compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
                    callback(compressedDataUrl);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function handleImgs(e) {
            var files = e.target.files;
            if (!files.length) return;
            for (var i = 0; i < files.length; i++) {
                compressImage(files[i], function(compressedResult) {
                    currentTempImages.push(compressedResult);
                    renderTempImagePreviews();
                });
            }
        }

        function renderTempImagePreviews() {
            var container = document.getElementById('imagePreviewContainer');
            if(!container) return;
            container.innerHTML = currentTempImages.map(function(imgSrc, index) {
                return '<div class="relative w-12 h-12 flex-shrink-0 rounded-lg overflow-hidden border border-slate-700">' +
                    '<img src="' + imgSrc + '" class="w-full h-full object-cover">' +
                    '<button type="button" onclick="removeTempImage(' + index + ')" class="absolute top-0 right-0 bg-red-600 text-white w-4 h-4 rounded-bl flex items-center justify-center text-[10px] font-bold">&times;</button>' +
                '</div>';
            }).join('');
        }

        function removeTempImage(index) {
            currentTempImages.splice(index, 1);
            renderTempImagePreviews();
        }

        function addCustomFieldRow(key, value) {
            var box = document.getElementById('customFieldsBox');
            var div = document.createElement('div');
            div.className = 'flex gap-2 items-center';
            div.innerHTML = '<input type="text" placeholder="Key (e.g. Bezel)" value="' + (key || '') + '" class="custom-key flex-1 bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-indigo-500">' +
                '<input type="text" placeholder="Value (e.g. Ceramic)" value="' + (value || '') + '" class="custom-val flex-1 bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-indigo-500">' +
                '<button type="button" onclick="this.parentElement.remove()" class="bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white px-2 py-1 rounded-lg text-xs font-bold">&times;</button>';
            box.appendChild(div);
        }
                    function openDetailModal(id) {
            var w = watches.find(function(item) { return item.id === id; });
            if (!w) return;

            document.getElementById('detCategory').innerText = w.category;
            document.getElementById('detTitle').innerText = w.brand + ' ' + w.model;
            document.getElementById('detVal').innerText = w.currentValue ? '$' + Number(w.currentValue).toLocaleString() : '$0';
            document.getElementById('detMovement').innerText = w.movementType || 'N/A';
            document.getElementById('detSerial').innerText = w.serialNumber || 'N/A';
            document.getElementById('detDesc').innerText = w.description || 'No notes provided.';

            var imgContainer = document.getElementById('detImagesContainer');
            if (w.images && w.images.length) {
                lightboxImagesList = w.images;
                imgContainer.innerHTML = w.images.map(function(img, idx) {
                    return '<img src="' + img + '" onclick="openLightboxAtIndex(' + idx + ')" class="w-32 h-32 object-cover rounded-xl border border-slate-800 flex-shrink-0 cursor-pointer hover:opacity-90 transition-opacity" title="Tap to enlarge">';
                }).join('');
                imgContainer.classList.remove('hidden');
            } else {
                lightboxImagesList = [];
                imgContainer.innerHTML = '';
                imgContainer.classList.add('hidden');
            }

            var custSec = document.getElementById('detCustomFieldsSection');
            if (w.customFields && Object.keys(w.customFields).length) {
                custSec.innerHTML = '<h4 class="text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-1">Custom Specifications</h4>' +
                    '<div class="grid grid-cols-2 gap-1.5 bg-slate-950 p-3 rounded-2xl border border-slate-800/80 text-xs">' +
                    Object.keys(w.customFields).map(function(k) {
                        return '<div><span class="text-slate-500 block uppercase text-[9px] font-bold">' + k + '</span><span class="text-slate-200">' + w.customFields[k] + '</span></div>';
                    }).join('') + '</div>';
            } else {
                custSec.innerHTML = '';
            }

            document.getElementById('detEditBtn').onclick = function() {
                closeDetailModal();
                editWatch(w.id);
            };
            document.getElementById('detShareBtn').onclick = function() {
                closeDetailModal();
                openShareModal(w.id);
            };

            document.getElementById('detailModal').classList.remove('hidden');
            document.getElementById('detailModal').classList.add('flex');
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.add('hidden');
            document.getElementById('detailModal').classList.remove('flex');
        }

        function openLightboxAtIndex(index) {
            if (!lightboxImagesList.length) return;
            lightboxCurrentIndex = index;
            updateLightboxDisplay();
            var box = document.getElementById('lightboxModal');
            box.classList.remove('hidden');
            box.classList.add('flex');
        }

        function updateLightboxDisplay() {
            document.getElementById('lightboxImg').src = lightboxImagesList[lightboxCurrentIndex];
            
            var prevBtn = document.getElementById('lightboxPrevBtn');
            var nextBtn = document.getElementById('lightboxNextBtn');
            var counter = document.getElementById('lightboxCounter');

            if (lightboxImagesList.length > 1) {
                prevBtn.classList.remove('hidden');
                nextBtn.classList.remove('hidden');
                counter.innerText = (lightboxCurrentIndex + 1) + ' / ' + lightboxImagesList.length;
                counter.classList.remove('hidden');
            } else {
                prevBtn.classList.add('hidden');
                nextBtn.classList.add('hidden');
                counter.classList.add('hidden');
            }
        }

        function nextLightboxImage() {
            if (!lightboxImagesList.length) return;
            lightboxCurrentIndex = (lightboxCurrentIndex + 1) % lightboxImagesList.length;
            updateLightboxDisplay();
        }

        function prevLightboxImage() {
            if (!lightboxImagesList.length) return;
            lightboxCurrentIndex = (lightboxCurrentIndex - 1 + lightboxImagesList.length) % lightboxImagesList.length;
            updateLightboxDisplay();
        }

        function closeLightbox() {
            var box = document.getElementById('lightboxModal');
            box.classList.add('hidden');
            box.classList.remove('flex');
        }

        // Touch Swipe Gesture Handlers for Mobile Lightbox
        var touchStartX = 0;
        var touchEndX = 0;

        document.addEventListener('touchstart', function(e) {
            if (e.target.id === 'lightboxImg' || e.target.closest('#lightboxModal')) {
                touchStartX = e.changedTouches[0].screenX;
            }
        }, false);

        document.addEventListener('touchend', function(e) {
            if (e.target.id === 'lightboxImg' || e.target.closest('#lightboxModal')) {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipeGesture();
            }
        }, false);

        function handleSwipeGesture() {
            var threshold = 50;
            if (touchEndX < touchStartX - threshold) {
                nextLightboxImage();
            }
            if (touchEndX > touchStartX + threshold) {
                prevLightboxImage();
            }
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            
            var fileInput = document.getElementById('imgs');
            if (fileInput && fileInput.files && fileInput.files.length > 0) {
                var filePromises = Array.from(fileInput.files).map(function(file) {
                    return new Promise(function(resolve) {
                        compressImage(file, function(compressed) {
                            resolve(compressed);
                        });
                    });
                });
                var loadedImgs = await Promise.all(filePromises);
                loadedImgs.forEach(function(img) {
                    if (!currentTempImages.includes(img)) currentTempImages.push(img);
                });
            }

            var id = document.getElementById('watchId').value;
            var customFields = {};
            var keys = document.querySelectorAll('.custom-key');
            var vals = document.querySelectorAll('.custom-val');
            keys.forEach(function(kInput, i) {
                if (kInput.value.trim()) customFields[kInput.value.trim()] = vals[i].value.trim();
            });

            var watchData = {
                id: id ? Number(id) : Date.now(),
                brand: document.getElementById('brand').value,
                model: document.getElementById('model').value,
                category: document.getElementById('category').value,
                currentValue: document.getElementById('currentValue').value,
                movementType: document.getElementById('movementType').value,
                serialNumber: document.getElementById('serialNumber').value,
                description: document.getElementById('description').value,
                images: currentTempImages,
                customFields: customFields
            };

            if (id) {
                var idx = watches.findIndex(function(w) { return w.id === Number(id); });
                if (idx !== -1) watches[idx] = watchData;
            } else {
                watches.push(watchData);
            }

            try {
                localStorage.setItem('watches_v2', JSON.stringify(watches));
            } catch (err) {
                alert("Storage limit reached! Try exporting a backup file to free up space.");
                return;
            }

            closeModal();
            render();
        }

        function editWatch(id) {
            var w = watches.find(function(item) { return item.id === id; });
            if (!w) return;
            document.getElementById('modalTitle').innerText = 'Edit Watch';
            document.getElementById('watchId').value = w.id;
            document.getElementById('brand').value = w.brand || '';
            document.getElementById('model').value = w.model || '';
            document.getElementById('category').value = w.category || 'Diver';
            document.getElementById('currentValue').value = w.currentValue || '';
            document.getElementById('movementType').value = w.movementType || '';
            document.getElementById('serialNumber').value = w.serialNumber || '';
            document.getElementById('description').value = w.description || '';

            currentTempImages = w.images ? [...w.images] : [];
            renderTempImagePreviews();

            var box = document.getElementById('customFieldsBox');
            box.innerHTML = '';
            if (w.customFields) {
                Object.keys(w.customFields).forEach(function(k) {
                    addCustomFieldRow(k, w.customFields[k]);
                });
            }

            document.getElementById('watchModal').classList.remove('hidden');
            document.getElementById('watchModal').classList.add('flex');
        }

        function deleteWatch(id) {
            if (confirm("Delete this watch record?")) {
                watches = watches.filter(function(w) { return w.id !== id; });
                localStorage.setItem('watches_v2', JSON.stringify(watches));
                render();
            }
        }

        function openShareModal(id) {
            activeShareWatchId = id;
            var w = watches.find(function(item) { return item.id === id; });
            if (!w) return;

            var box = document.getElementById('shareOptionsBox');
            var html = '';
            var items = [
                { id: 'sb_brand', label: 'Watch Name', val: w.brand + ' ' + w.model, def: true },
                { id: 'sb_cat', label: 'Category', val: w.category, def: true },
                { id: 'sb_val', label: 'Estimated Value', val: '$' + (w.currentValue || 'N/A'), def: true },
                { id: 'sb_mov', label: 'Movement', val: w.movementType, def: true },
                { id: 'sb_sn', label: 'Serial No.', val: w.serialNumber, def: false },
                { id: 'sb_desc', label: 'Notes', val: w.description, def: false }
            ];

            items.forEach(function(item) {
                if (item.val) {
                    html += '<label class="flex items-center gap-2 cursor-pointer hover:text-white"><input type="checkbox" id="' + item.id + '" ' + (item.def ? 'checked' : '') + ' class="rounded accent-indigo-600"><span>' + item.label + ': ' + item.val + '</span></label>';
                }
            });

            if (w.customFields) {
                Object.keys(w.customFields).forEach(function(k) {
                    html += '<label class="flex items-center gap-2 cursor-pointer hover:text-white"><input type="checkbox" class="sc_cust" data-k="' + k + '" data-v="' + w.customFields[k] + '" checked class="rounded accent-indigo-600"><span>' + k + ': ' + w.customFields[k] + '</span></label>';
                });
            }

            box.innerHTML = html;
            document.getElementById('shareModal').classList.remove('hidden');
            document.getElementById('shareModal').classList.add('flex');
        }

        function closeShareModal() {
            document.getElementById('shareModal').classList.add('hidden');
            document.getElementById('shareModal').classList.remove('flex');
        }

        function buildShareTextPayload() {
            var w = watches.find(function(item) { return item.id === activeShareWatchId; });
            if (!w) return '';
            var txt = "⌚ Watch Details Report\n";
            if (document.getElementById('sb_brand') && document.getElementById('sb_brand').checked) txt += "Watch: " + w.brand + " " + w.model + "\n";
            if (document.getElementById('sb_cat') && document.getElementById('sb_cat').checked) txt += "Category: " + w.category + "\n";
            if (document.getElementById('sb_val') && document.getElementById('sb_val').checked) txt += "Est. Value: $" + (w.currentValue || 'N/A') + "\n";
            if (document.getElementById('sb_mov') && document.getElementById('sb_mov').checked) txt += "Movement: " + (w.movementType || 'N/A') + "\n";
            if (document.getElementById('sb_sn') && document.getElementById('sb_sn').checked) txt += "Serial: " + (w.serialNumber || 'N/A') + "\n";
            if (document.getElementById('sb_desc') && document.getElementById('sb_desc').checked) txt += "Notes: " + (w.description || 'None') + "\n";

            document.querySelectorAll('.sc_cust').forEach(function(el) {
                if (el.checked) txt += el.getAttribute('data-k') + ": " + el.getAttribute('data-v') + "\n";
            });
            return txt;
        }

        function executeShareText() {
            var w = watches.find(function(item) { return item.id === activeShareWatchId; });
            var txt = buildShareTextPayload();
            closeShareModal();
            if (navigator.share) navigator.share({ title: w.brand + " " + w.model, text: txt });
            else prompt("Copy report to share:", txt);
        }

        function executeEmailReport() {
            var w = watches.find(function(item) { return item.id === activeShareWatchId; });
            var txt = buildShareTextPayload();
            closeShareModal();
            window.location.href = "mailto:?subject=" + encodeURIComponent("Watch Specification: " + w.brand + " " + w.model) + "&body=" + encodeURIComponent(txt);
        }

        function executeGeneratePDF() {
            var w = watches.find(function(item) { return item.id === activeShareWatchId; });
            if (!w) return;

            var pdfHtml = '<div style="font-family:sans-serif; padding:20px; max-width:600px; margin:auto;">' +
                '<h1 style="border-bottom:2px solid #cbd5e1; padding-bottom:8px; color:#0f172a;">Watch Vault Record Report</h1>' +
                '<h2 style="color:#475569; margin-top:16px;">' + w.brand + ' ' + w.model + '</h2>' +
                '<p><strong>Category:</strong> ' + w.category + '</p>' +
                '<p><strong>Estimated Value:</strong> $' + (w.currentValue || 'N/A') + '</p>' +
                '<p><strong>Movement:</strong> ' + (w.movementType || 'N/A') + '</p>' +
                '<p><strong>Serial Number:</strong> ' + (w.serialNumber || 'N/A') + '</p>' +
                '<p><strong>Notes:</strong> ' + (w.description || 'N/A') + '</p>';

            if (w.customFields && Object.keys(w.customFields).length) {
                pdfHtml += '<h3>Custom Specifications</h3><ul>';
                Object.keys(w.customFields).forEach(function(k) {
                    pdfHtml += '<li><strong>' + k + ':</strong> ' + w.customFields[k] + '</li>';
                });
                pdfHtml += '</ul>';
            }

            if (w.images && w.images.length) {
                pdfHtml += '<h3>Attached Photos</h3><div style="display:flex; flex-wrap:wrap; gap:10px;">';
                w.images.forEach(function(img) {
                    pdfHtml += '<img src="' + img + '" style="width:180px; height:130px; object-fit:cover; border-radius:8px; border:1px solid #cbd5e1;">';
                });
                pdfHtml += '</div>';
            }
            pdfHtml += '</div>';

            closeShareModal();
            var win = window.open('', '', 'width=700,height=700');
            win.document.write('<html><head><title>Watch Report - ' + w.brand + ' ' + w.model + '</title></head><body>' + pdfHtml + '</body></html>');
            win.document.close();
            win.focus();
            setTimeout(function() { win.print(); }, 500);
        }

        function exportBackup() {
            var dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(watches));
            var dl = document.createElement('a');
            dl.setAttribute("href", dataStr);
            dl.setAttribute("download", "watch_vault_backup_" + new Date().toISOString().slice(0, 10) + ".json");
            document.body.appendChild(dl);
            dl.click();
            dl.remove();
        }

        function importBackup(e) {
            var file = e.target.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    var parsed = JSON.parse(evt.target.result);
                    if (Array.isArray(parsed)) {
                        if (confirm("Restore " + parsed.length + " watches into your collection?")) {
                            watches = parsed;
                            localStorage.setItem('watches_v2', JSON.stringify(watches));
                            render();
                            alert("Backup restored!");
                        }
                    }
                } catch (err) { alert("Invalid backup file format."); }
            };
            reader.readAsText(file);
        }

                return;

                            '<span class="text-emerald-400 font-bold text-sm">' + (w.currentValue ? '$' + Number(w.currentValue).toLocaleString() : '$0') + '</span>' +
                        '</div>' +

                        '<p class="text-xs text-slate-400 leading-relaxed line-clamp-2">' + (w.description || 'No description provided.') + '</p>' +
                        custHtml +
                    '</div>' +
                    '<div class="flex justify-between items-center px-4 pb-4 pt-2 border-t border-s
