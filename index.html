<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Vault</title>
    <style>
        body { font-family: sans-serif; background: #090d16; margin: 0; padding: 16px; color: #f8fafc; }
        header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; color: white; padding: 12px 16px; border-radius: 10px; margin-bottom: 16px; border: 1px solid #334155; }
        button { background: #6366f1; color: white; border: none; padding: 8px 14px; border-radius: 16px; font-weight: bold; font-size: 13px; cursor: pointer; }
        .card { background: #1e293b; border-radius: 10px; margin-bottom: 12px; border: 1px solid #334155; overflow: hidden; }
        .card-img { width: 100%; height: 160px; object-fit: cover; background: #0f172a; }
        .card-body { padding: 14px; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); justify-content: center; align-items: center; padding: 16px; z-index: 50; }
        .modal.open { display: flex; }
        .modal-box { background: #1e293b; color: #f8fafc; padding: 18px; border-radius: 14px; width: 100%; max-width: 380px; max-height: 85vh; overflow-y: auto; border: 1px solid #334155; }
        input, select, textarea { width: 100%; padding: 8px; margin: 4px 0 10px 0; border: 1px solid #475569; border-radius: 6px; box-sizing: border-box; font-size: 14px; background: #0f172a; color: #f8fafc; }
        label { font-size: 11px; font-weight: bold; color: #94a3b8; text-transform: uppercase; }
        .img-prev { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 10px; }
        .img-prev img { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; border: 1px solid #475569; }
        .chk-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 13px; color: #cbd5e1; }
        .chk-row input { width: auto; margin: 0; }
    </style>
</head>
<body>
    <header>
        <h3 style="margin:0;">⌚ Watch Vault</h3>
        <button onclick="toggleM('modal', true)">+ Add Watch</button>
    </header>

    <div id="list"></div>

    <!-- Add Watch Modal -->
    <div id="modal" class="modal">
        <div class="modal-box">
            <h3 style="margin-top:0;">Add Watch</h3>
            <form onsubmit="saveW(event)">
                                <label>Brand</label><input type="text" id="brand" required placeholder="Rolex">
                <label>Model</label><input type="text" id="model" required placeholder="Submariner">
                <label>Category</label>
                <select id="cat">
                    <option>Diver</option><option>Dress</option><option>Chronograph</option><option>Field</option><option>Vintage</option>
                </select>
                <label>Est. Value ($)</label><input type="number" id="val">
                <label>Movement</label><input type="text" id="mov" placeholder="Automatic">
                <label>Serial No.</label><input type="text" id="sn">
                <label>Notes</label><textarea id="notes" rows="2"></textarea>
                
                <label>Images</label>
                <input type="file" id="imgs" accept="image/*" multiple onchange="handleImgs(event)">
                <div id="imgPrev" class="img-prev"></div>

                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                    <label>Custom Fields</label>
                    <button type="button" onclick="addCustomRow()" style="background:none; color:#818cf8; padding:0;">+ Add Field</button>
                </div>
                <div id="customBox"></div>

                <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:12px;">
                    <button type="button" onclick="toggleM('modal', false)" style="background:#475569;">Cancel</button>
                    <button type="submit">Save Watch</button>
                </div>
            </form>
        </div>
    </div>
        <!-- Selective Share Modal -->
    <div id="shareModal" class="modal">
        <div class="modal-box">
            <h3 style="margin-top:0;">Select Items to Share</h3>
            <div id="shareChkBox"></div>
            <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:14px;">
                <button type="button" onclick="toggleM('shareModal', false)" style="background:#475569;">Cancel</button>
                <button type="button" onclick="doShare()">Share Now</button>
            </div>
        </div>
    </div>

    <script>
        var W = JSON.parse(localStorage.getItem('W') || '[]');
        var tempImgs = [];
        var activeShareId = null;

        function toggleM(id, show) {
            document.getElementById(id).className = show ? 'modal open' : 'modal';
            if(!show && id === 'modal') { tempImgs = []; document.getElementById('imgPrev').innerHTML = ''; document.getElementById('customBox').innerHTML = ''; }
        }

        function handleImgs(e) {
            var files = e.target.files;
            for(var i=0; i<files.length; i++) {
                var r = new FileReader();
                r.onload = function(evt) {
                    tempImgs.push(evt.target.result);
                    renderImgs();
                };
                r.readAsDataURL(files[i]);
            }
        }

        function renderImgs() {
            document.getElementById('imgPrev').innerHTML = tempImgs.map(function(src){ return '<img src="'+src+'">'; }).join('');
        }

        function addCustomRow(k, v) {
            var d = document.createElement('div');
            d.style.display = 'flex'; d.style.gap = '6px'; d.style.marginBottom = '6px';
            d.innerHTML = '<input type="text" placeholder="Field" value="'+(k||'')+'" class="ckey" style="margin:0;"><input type="text" placeholder="Value" value="'+(v||'')+'" class="cval" style="margin:0;"><button type="button" onclick="this.parentElement.remove()" style="background:#ef4444; padding:0 8px;">&times;</button>';
            document.getElementById('customBox').appendChild(d);
        }
                function saveW(e) {
            e.preventDefault();
            var custom = {};
            var keys = document.querySelectorAll('.ckey');
            var vals = document.querySelectorAll('.cval');
            keys.forEach(function(k, i){ if(k.value.trim()) custom[k.value.trim()] = vals[i].value.trim(); });

            W.push({
                id: Date.now(),
                b: document.getElementById('brand').value,
                m: document.getElementById('model').value,
                c: document.getElementById('cat').value,
                v: document.getElementById('val').value,
                mov: document.getElementById('mov').value,
                sn: document.getElementById('sn').value,
                n: document.getElementById('notes').value,
                imgs: tempImgs,
                cust: custom
            });
            localStorage.setItem('W', JSON.stringify(W));
            e.target.reset();
            toggleM('modal', false);
            render();
        }

        function delW(id) {
            if(confirm("Delete watch?")) { W = W.filter(function(x){ return x.id !== id; }); localStorage.setItem('W', JSON.stringify(W)); render(); }
        }

        function openShare(id) {
            activeShareId = id;
            var x = W.find(function(w){ return w.id === id; });
            if(!x) return;
            var html = '';
            var fields = [
                {k:'b', label:'Brand & Model', val: x.b + ' ' + x.m, def: true},
                {k:'c', label:'Category', val: x.c, def: true},
                {k:'v', label:'Estimated Value', val: '$' + (x.v || 'N/A'), def: true},
                {k:'mov', label:'Movement', val: x.mov, def: true},
                {k:'sn', label:'Serial Number', val: x.sn, def: false},
                {k:'n', label:'Notes', val: x.n, def: false}
            ];
            fields.forEach(function(f){
                if(f.val) html += '<label class="chk-row"><input type="checkbox" id="sc_'+f.k+'" '+(f.def?'checked':'')+'><span>'+f.label+': '+f.val+'</span></label>';
            });
            if(x.cust) {
                Object.keys(x.cust).forEach(function(ck){
                    html += '<label class="chk-row"><input type="checkbox" class="sc_cust" data-k="'+ck+'" data-v="'+x.cust[ck]+'" checked><span>'+ck+': '+x.cust[ck]+'</span></label>';
                });
            }
            document.getElementById('shareChkBox').innerHTML = html;
            toggleM('shareModal', true);
        }

        function doShare() {
            var x = W.find(function(w){ return w.id === activeShareId; });
            if(!x) return;
            var txt = "⌚ Watch Details Report\n";
            if(document.getElementById('sc_b') && document.getElementById('sc_b').checked) txt += "Watch: " + x.b + " " + x.m + "\n";
            if(document.getElementById('sc_c') && document.getElementById('sc_c').checked) txt += "Category: " + x.c + "\n";
            if(document.getElementById('sc_v') && document.getElementById('sc_v').checked) txt += "Value: $" + (x.v || 'N/A') + "\n";
            if(document.getElementById('sc_mov') && document.getElementById('sc_mov').checked) txt += "Movement: " + (x.mov || 'N/A') + "\n";
            if(document.getElementById('sc_sn') && document.getElementById('sc_sn').checked) txt += "Serial: " + (x.sn || 'N/A') + "\n";
            if(document.getElementById('sc_n') && document.getElementById('sc_n').checked) txt += "Notes: " + (x.n || 'None') + "\n";
            
            document.querySelectorAll('.sc_cust').forEach(function(el){
                if(el.checked) txt += el.getAttribute('data-k') + ": " + el.getAttribute('data-v') + "\n";
            });

            toggleM('shareModal', false);
            if(navigator.share) navigator.share({title: x.b + " " + x.m, text: txt});
            else prompt("Copy details to share:", txt);
        }

        function render() {
            var el = document.getElementById('list');
            if(!W.length) { el.innerHTML = '<p style="text-align:center; color:#94a3b8; margin-top:30px;">No watches yet. Tap "+ Add Watch" to start!</p>'; return; }
            el.innerHTML = W.map(function(x){
                var imgHtml = (x.imgs && x.imgs.length) ? '<img src="'+x.imgs[0]+'" class="card-img">' : '';
                return '<div class="card">' + imgHtml +
                    '<div class="card-body">' +
                        '<div style="display:flex; justify-content:space-between; align-items:center;">' +
                            '<span style="font-size:11px; background:#312e81; color:#c7d2fe; padding:2px 6px; border-radius:8px; font-weight:bold;">'+x.c+'</span>' +
                            '<b style="font-size:14px; color:#34d399;">$'+(x.v || '0')+'</b>' +
                        '</div>' +
                        '<h3 style="margin:6px 0 2px 0; font-size:16px;">'+x.b+' '+x.m+'</h3>' +
                        '<p style="font-size:12px; color:#94a3b8; margin:0 0 10px 0;">'+(x.n || 'No notes')+'</p>' +
                        '<div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid #334155; padding-top:8px;">' +
                            '<button onclick="openShare('+x.id+')" style="background:#475569; padding:4px 10px; font-size:11px;">Share</button>' +
                            '<button onclick="delW('+x.id+')" style="background:#ef4444; padding:4px 10px; font-size:11px;">Delete</button>' +
                        '</div>' +
                    '</div>' +
                '</div>';
            }).join('');
        }
        render();
    </script>
</body>
</html>
