<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Collection Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; }
    </style>
</head>
<body class="min-h-screen pb-12">
    <!-- Header -->
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-30">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-tight">⌚ Watch Vault</h1>
            <button onclick="openAddModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-full text-sm font-medium shadow transition">
                + Add Watch
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-6">
        <!-- Categories Filter -->
        <div class="flex space-x-2 overflow-x-auto pb-4 mb-6 scrollbar-none" id="categoryFilters">
            <button onclick="filterCategory('All')" class="category-btn px-4 py-1.5 rounded-full text-sm font-medium bg-slate-900 text-white whitespace-nowrap shadow-sm">All</button>
            <button onclick="filterCategory('Diver')" class="category-btn px-4 py-1.5 rounded-full text-sm font-medium bg-white text-slate-600 border border-slate-200 whitespace-nowrap shadow-sm">Diver</button>
            <button onclick="filterCategory('Dress')" class="category-btn px-4 py-1.5 rounded-full text-sm font-medium bg-white text-slate-600 border border-slate-200 whitespace-nowrap shadow-sm">Dress</button>
            <button onclick="filterCategory('Chronograph')" class="category-btn px-4 py-1.5 rounded-full text-sm font-medium bg-white text-slate-600 border border-slate-200 whitespace-nowrap shadow-sm">Chronograph</button>
            <button onclick="filterCategory('Field')" class="category-btn px-4 py-1.5 rounded-full text-sm font-medium bg-white text-slate-600 border border-slate-200 whitespace-nowrap shadow-sm">Field</button>
            <button onclick="filterCategory('Vintage')" class="category-btn px-4 py-1.5 rounded-full text-sm font-medium bg-white text-slate-600 border border-slate-200 whitespace-nowrap shadow-sm">Vintage</button>
        </div>

        <!-- Watch Grid -->
        <div id="watchGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <!-- Dynamic Watches Inserted Here -->
        </div>
    </main>

    <!-- Add/Edit Watch Modal -->
    <div id="watchModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto p-6 shadow-xl">
            <h2 id="modalTitle" class="text-lg font-bold text-slate-900 mb-4">Add New Watch</h2>
            <form id="watchForm" onsubmit="saveWatch(event)" class="space-y-4">
                <input type="hidden" id="watchId">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Brand</label>
                        <input type="text" id="brand" required class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Model</label>
                        <input type="text" id="model" required class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Category</label>
                        <select id="category" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                            <option value="Diver">Diver</option>
                            <option value="Dress">Dress</option>
                            <option value="Chronograph">Chronograph</option>
                            <option value="Field">Field</option>
                            <option value="Vintage">Vintage</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Movement Type</label>
                        <input type="text" id="movementType" placeholder="Automatic, Quartz..." class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Serial Number</label>
                        <input type="text" id="serialNumber" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Purchase Date</label>
                        <input type="date" id="purchaseDate" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Purchase Price ($)</label>
                        <input type="number" id="purchasePrice" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Current Value ($)</label>
                        <input type="number" id="currentValue" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Description</label>
                    <textarea id="description" rows="2" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Notes on Issues / Service</label>
                    <textarea id="notesOnIssues" rows="2" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Photos (Upload Images)</label>
                    <input type="file" id="imageInput" accept="image/*" multiple onchange="handleImages(event)" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                    <div id="imagePreviewContainer" class="flex gap-2 mt-2 overflow-x-auto"></div>
                </div>

                <!-- Custom Sections -->
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-xs font-semibold text-slate-500 uppercase">Custom Sections</label>
                        <button type="button" onclick="addCustomFieldRow()" class="text-indigo-600 text-xs font-medium hover:underline">+ Add Field</button>
                    </div>
                    <div id="customFieldsContainer" class="space-y-2"></div>
                </div>

                <div class="flex justify-end space-x-3 pt-4">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100">Cancel</button>
                    <button type="submit" class="px-4 py-2 rounded-lg text-sm font-medium bg-indigo-600 hover:bg-indigo-700 text-white shadow">Save Watch</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Share Modal -->
    <div id="shareModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl">
            <h2 class="text-lg font-bold text-slate-900 mb-2">Configure Share</h2>
            <p class="text-xs text-slate-500 mb-4">Select which details to include in the shareable report:</p>
            <div id="shareCheckboxes" class="space-y-2 mb-6">
                <label class="flex items-center space-x-3 text-sm"><input type="checkbox" id="chk_brand" checked class="rounded text-indigo-600"><span>Brand & Model</span></label>
                <label class="flex items-center space-x-3 text-sm"><input type="checkbox" id="chk_category" checked class="rounded text-indigo-600"><span>Category & Movement</span></label>
                <label class="flex items-center space-x-3 text-sm"><input type="checkbox" id="chk_serial" class="rounded text-indigo-600"><span>Serial Number (Private by default)</span></label>
                <label class="flex items-center space-x-3 text-sm"><input type="checkbox" id="chk_price" class="rounded text-indigo-600"><span>Purchase Price</span></label>
                <label class="flex items-center space-x-3 text-sm"><input type="checkbox" id="chk_value" checked class="rounded text-indigo-600"><span>Current Value</span></label>
                <label class="flex items-center space-x-3 text-sm"><input type="checkbox" id="chk_desc" checked class="rounded text-indigo-600"><span>Description</span></label>
                <label class="flex items-center space-x-3 text-sm"><input type="checkbox" id="chk_notes" class="rounded text-indigo-600"><span>Notes on Issues</span></label>
            </div>
            <div class="flex justify-end space-x-3">
                <button onclick="closeShareModal()" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100">Cancel</button>
                <button onclick="generateShareText()" class="px-4 py-2 rounded-lg text-sm font-medium bg-indigo-600 hover:bg-indigo-700 text-white shadow">Generate & Share</button>
            </div>
        </div>
    </div>

    <script>
        let watches = JSON.parse(localStorage.getItem('watches') || '[]');
        let currentFilter = 'All';
        let currentImages = [];
        let sharingWatchId = null;

        function saveToStorage() {
            localStorage.setItem('watches', JSON.stringify(watches));
            renderWatches();
        }

        function filterCategory(cat) {
            currentFilter = cat;
            document.querySelectorAll('.category-btn').forEach(btn => {
                if (btn.innerText === cat) {
                    btn.className = "category-btn px-4 py-1.5 rounded-full text-sm font-medium bg-slate-900 text-white whitespace-nowrap shadow-sm";
                } else {
                    btn.className = "category-btn px-4 py-1.5 rounded-full text-sm font-medium bg-white text-slate-600 border border-slate-200 whitespace-nowrap shadow-sm";
                }
            });
            renderWatches();
        }

        function renderWatches() {
            const grid = document.getElementById('watchGrid');
            const filtered = currentFilter === 'All' ? watches : watches.filter(w => w.category === currentFilter);
            
            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 text-sm">No watches found in this category. Tap '+ Add Watch' to start your collection.</div>`;
                return;
            }

            grid.innerHTML = filtered.map(w => `
                <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden flex flex-col justify-between">
                    <div>
                        ${w.images && w.images.length > 0 ? `
                            <div class="h-48 bg-slate-100 overflow-hidden relative">
                                <img src="${w.images[0]}" class="w-full h-full object-cover">
                                ${w.images.length > 1 ? `<span class="absolute bottom-2 right-2 bg-black/60 text-white text-xs px-2 py-0.5 rounded-full">+${w.images.length - 1} more</span>` : ''}
                            </div>
                        ` : `<div class="h-32 bg-slate-100 flex items-center justify-center text-slate-400 text-xs font-medium">No Image</div>`}
                        <div class="p-4">
                            <div class="flex justify-between items-start mb-1">
                                <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-indigo-50 text-indigo-700">${w.category}</span>
                                <span class="text-sm font-bold text-slate-900">$${w.currentValue || 0}</span>
                            </div>
                            <h3 class="text-base font-bold text-slate-900">${w.brand} ${w.model}</h3>
                            <p class="text-xs text-slate-500 mb-2">${w.movementType || 'Standard Movement'}</p>
                            <p class="text-xs text-slate-600 line-clamp-2">${w.description || 'No description provided.'}</p>
                        </div>
                    </div>
                    <div class="px-4 py-3 bg-slate-50 border-t border-slate-100 flex justify-between items-center">
                        <button onclick="openShareModal(${w.id})" class="text-xs font-semibold text-indigo-600 hover:text-indigo-800">Share Report</button>
                        <div class="flex space-x-2">
                            <button onclick="editWatch(${w.id})" class="text-xs font-medium text-slate-600 hover:text-slate-900">Edit</button>
                            <button onclick="deleteWatch(${w.id})" class="text-xs font-medium text-rose-600 hover:text-rose-800">Delete</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function handleImages(event) {
            const files = event.target.files;
            for (let file of files) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentImages.push(e.target.result);
                    renderImagePreviews();
                }
                reader.readAsDataURL(file);
            }
        }

        function renderImagePreviews() {
            const container = document.getElementById('imagePreviewContainer');
            container.innerHTML = currentImages.map((img, idx) => `
                <div class="relative w-16 h-16 rounded-lg overflow-hidden border border-slate-200 flex-shrink-0">
                    <img src="${img}" class="w-full h-full object-cover">
                    <button type="button" onclick="currentImages.splice(${idx},1);renderImagePreviews()" class="absolute top-0 right-0 bg-rose-600 text-white text-[10px] w-4 h-4 flex items-center justify-center rounded-bl">&times;</button>
                </div>
            `).join('');
        }

        function addCustomFieldRow(key = '', val = '') {
            const container = document.getElementById('customFieldsContainer');
            const div = document.createElement('div');
            div.className = "flex space-x-2";
            div.innerHTML = `
                <input type="text" placeholder="Field Name" value="${key}" class="custom-key w-1/2 bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs outline-none">
                <input type="text" placeholder="Value" value="${val}" class="custom-val w-1/2 bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs outline-none">
                <button type="button" onclick="this.parentElement.remove()" class="text-rose-500 text-xs px-2">&times;</button>
            `;
            container.appendChild(div);
        }

        function openAddModal() {
            document.getElementById('modalTitle').innerText = "Add New Watch";
            document.getElementById('watchForm').reset();
            document.getElementById('watchId').value = "";
            currentImages = [];
            document.getElementById('imagePreviewContainer').innerHTML = "";
            document.getElementById('customFieldsContainer').innerHTML = "";
            document.getElementById('watchModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('watchModal').classList.add('hidden');
        }

        function editWatch(id) {
            const w = watches.find(item => item.id === id);
            if (!w) return;
            document.getElementById('modalTitle').innerText = "Edit Watch";
            document.getElementById('watchId').value = w.id;
            document.getElementById('brand').value = w.brand || '';
            document.getElementById('model').value = w.model || '';
            document.getElementById('category').value = w.category || 'Diver';
            document.getElementById('movementType').value = w.movementType || '';
            document.getElementById('serialNumber').value = w.serialNumber || '';
            document.getElementById('purchaseDate').value = w.purchaseDate || '';
            document.getElementById('purchasePrice').value = w.purchasePrice || '';
            document.getElementById('currentValue').value = w.currentValue || '';
            document.getElementById('description').value = w.description || '';
            document.getElementById('notesOnIssues').value = w.notesOnIssues || '';
            
            currentImages = w.images || [];
            renderImagePreviews();

            const customContainer = document.getElementById('customFieldsContainer');
            customContainer.innerHTML = "";
            if (w.customFields) {
                for (let [k, v] of Object.entries(w.customFields)) {
                    addCustomFieldRow(k, v);
                }
            }
            document.getElementById('watchModal').classList.remove('hidden');
        }

        function saveWatch(event) {
            event.preventDefault();
            const id = document.getElementById('watchId').value;
            
            const customFields = {};
            const keys = document.querySelectorAll('.custom-key');
            const vals = document.querySelectorAll('.custom-val');
            keys.forEach((k, idx) => {
                if (k.value.trim()) customFields[k.value.trim()] = vals[idx].value.trim();
            });

            const watchData = {
                id: id ? Number(id) : Date.now(),
                brand: document.getElementById('brand').value,
                model: document.getElementById('model').value,
                category: document.getElementById('category').value,
                movementType: document.getElementById('movementType').value,
                serialNumber: document.getElementById('serialNumber').value,
                purchaseDate: document.
